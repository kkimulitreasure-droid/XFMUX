<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineWave - Stream Movies & Series</title>
  <!-- PWA Manifest & Mobile Web App Meta -->
  <link id="pwaManifestLink" rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#000000" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="CineWave" />
  <link id="appleTouchIconLink" rel="apple-touch-icon" href="/icon-192.png" />

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif']
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              accent: '#f43f5e'
            },
            dark: {
              900: '#000000',
              800: '#0a0a0a',
              700: '#121212',
              600: '#262626'
            }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #000000; }
    ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #1d9bf0; }
    .glass-nav {
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .glass-card {
      background: #0a0a0a;
      border: 1px solid #262626;
    }
    .glass-card:hover { border-color: #3f3f46; }
    .text-gradient {
      background: linear-gradient(45deg, #f09433 0%, #dc2743 50%, #1d9bf0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .ig-ring {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }
    .ig-btn {
      background: linear-gradient(45deg, #f09433 0%, #dc2743 55%, #bc1888 100%);
    }
    .x-btn {
      background: #1d9bf0;
    }
    .x-btn:hover {
      background: #1a8cd8;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes heartPop {
      0% { transform: scale(0.35); opacity: 0; }
      50% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }
    .heart-pop-anim { animation: heartPop 0.7s ease-out forwards; }
  </style>
</head>
<body class="bg-black text-zinc-100 font-sans min-h-screen flex flex-col selection:bg-sky-500 selection:text-white pb-16 md:pb-12">

  <!-- ================= TOP NAVIGATION BAR (INSTAGRAM + X HYBRID) ================= -->
  <header class="fixed top-0 left-0 right-0 z-40 glass-nav border-b border-zinc-800/90 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 sm:h-20">
        
        <!-- Logo & Navigation Links -->
        <div class="flex items-center gap-6">
          <a href="#" onclick="switchPrimaryMode('feed'); switchCategory('All')" class="flex items-center gap-2.5 text-xl sm:text-2xl font-display font-extrabold tracking-tight">
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl ig-ring p-[2px] shadow-lg">
              <div class="w-full h-full rounded-[10px] bg-black flex items-center justify-center">
                <i class="fa-solid fa-play text-white text-sm sm:text-base ml-0.5"></i>
              </div>
            </div>
            <span id="siteLogoText">Cine<span class="text-gradient">Wave</span></span>
          </a>

          <!-- Navigation Links (Desktop: IG/X Feed + Original Catalog Tabs) -->
          <nav class="hidden lg:flex items-center gap-1 font-semibold text-xs text-zinc-300">
            <button onclick="switchPrimaryMode('feed')" id="mode-feed" class="px-3.5 py-2 rounded-full bg-zinc-900 text-white font-bold transition-all flex items-center gap-1.5">
              <i class="fa-solid fa-house text-sky-400"></i> Feed (IG/X)
            </button>
            <button onclick="switchPrimaryMode('reels')" id="mode-reels" class="px-3.5 py-2 rounded-full hover:text-white hover:bg-zinc-900 transition-all flex items-center gap-1.5">
              <i class="fa-solid fa-film text-rose-500"></i> Reels
            </button>
            <button onclick="switchPrimaryMode('catalog'); switchCategory('All')" id="nav-all" class="px-3.5 py-2 rounded-full hover:text-white hover:bg-zinc-900 transition-all">Browse All</button>
            <button onclick="switchPrimaryMode('catalog'); switchCategory('Movies')" id="nav-movies" class="px-3.5 py-2 rounded-full hover:text-white hover:bg-zinc-900 transition-all">Movies</button>
            <button onclick="switchPrimaryMode('catalog'); switchCategory('TV Shows')" id="nav-tv" class="px-3.5 py-2 rounded-full hover:text-white hover:bg-zinc-900 transition-all">TV Series</button>
            <button onclick="switchPrimaryMode('catalog'); switchCategory('Music')" id="nav-music" class="px-3.5 py-2 rounded-full hover:text-white hover:bg-zinc-900 transition-all">Music</button>
            <button onclick="switchPrimaryMode('catalog'); switchCategory('Watchlist')" id="nav-watchlist" class="px-3.5 py-2 rounded-full hover:text-white hover:bg-zinc-900 transition-all flex items-center gap-1.5">
              <span>Watchlist</span>
              <span id="watchlist-badge" class="bg-sky-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold">0</span>
            </button>
            <button onclick="openProfileView()" id="mode-profile" class="px-3.5 py-2 rounded-full hover:text-white hover:bg-zinc-900 transition-all flex items-center gap-1.5">
              <i class="fa-regular fa-user text-pink-400"></i> Profile
            </button>
          </nav>
        </div>

        <!-- Search & Actions -->
        <div class="flex items-center gap-2">
          <!-- Search Bar -->
          <div class="relative w-32 sm:w-52">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-400 text-xs"></i>
            <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Search posts & titles..." class="w-full bg-zinc-900 border border-zinc-800 rounded-full pl-9 pr-3.5 py-1.5 text-xs text-white placeholder-zinc-400 focus:outline-none focus:border-sky-500 transition-all" />
          </div>

          <!-- PWA Install App Button -->
          <button id="pwaInstallBtn" onclick="triggerPwaInstall()" class="hidden px-3 py-2 rounded-full bg-emerald-500/15 border border-emerald-500/40 hover:bg-emerald-500/25 text-emerald-300 text-xs font-bold flex items-center gap-1.5 transition-all" title="Install CineWave App">
            <i class="fa-solid fa-download"></i>
            <span class="hidden sm:inline">Install App</span>
          </button>

          <!-- Upload Button -->
          <button id="topUploadBtn" onclick="openUserUploadModal()" class="px-3.5 py-2 rounded-full ig-btn hover:opacity-90 text-white text-xs font-bold flex items-center gap-1.5 shadow-lg transition-all">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span class="hidden sm:inline">Upload</span>
          </button>

          <!-- Owner Panel Button -->
          <button onclick="openAdminPortalModal()" id="adminToggleBtn" class="px-3 py-2 rounded-full bg-amber-500/15 border border-amber-500/40 hover:bg-amber-500/25 text-amber-300 text-xs font-bold flex items-center gap-1.5 transition-all">
            <i class="fa-solid fa-crown text-amber-400"></i>
            <span class="hidden md:inline" id="adminToggleText">Owner Panel</span>
          </button>

          <!-- User State Button -->
          <div id="user-nav-container"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- MOBILE BOTTOM BAR (INSTAGRAM / X STYLE) -->
  <nav class="lg:hidden fixed bottom-0 inset-x-0 z-40 bg-black/95 border-t border-zinc-800 h-14 flex items-center justify-around px-2">
    <button onclick="switchPrimaryMode('feed')" id="mob-feed" class="p-2 text-white text-lg" title="Feed"><i class="fa-solid fa-house"></i></button>
    <button onclick="switchPrimaryMode('reels')" id="mob-reels" class="p-2 text-zinc-400 text-lg" title="Reels"><i class="fa-solid fa-film"></i></button>
    <button onclick="focusSocialComposer()" class="p-2 text-sky-400 text-xl" title="New Post"><i class="fa-solid fa-circle-plus"></i></button>
    <button onclick="switchPrimaryMode('catalog'); switchCategory('All')" id="mob-catalog" class="p-2 text-zinc-400 text-lg" title="Movies & Music"><i class="fa-solid fa-clapperboard"></i></button>
    <button onclick="switchPrimaryMode('catalog'); switchCategory('Watchlist')" id="mob-watch" class="p-2 text-zinc-400 text-lg" title="Watchlist"><i class="fa-solid fa-bookmark"></i></button>
    <button onclick="openProfileView()" id="mob-profile" class="p-2 text-zinc-400 text-lg" title="IG Profile"><i class="fa-regular fa-circle-user"></i></button>
    <button onclick="handleLogout()" id="mob-logout" class="p-2 text-rose-400 hover:text-rose-300 text-lg" title="Log Out"><i class="fa-solid fa-right-from-bracket"></i></button>
  </nav>

  <!-- ================= MAIN CONTENT ================= -->
  <main id="userView" class="pt-20 sm:pt-24 max-w-7xl mx-auto px
