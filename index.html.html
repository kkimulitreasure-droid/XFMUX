<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineWave - Stream Movies & Series</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    // --- SUPABASE CLOUD INITIALIZATION ---
    const SUPABASE_URL = 'https://lggdzryghrfpjxsypjtc.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_Nxu7MdwBQrC1ok34HG9N6g_v7qCh...'; // Configured with your mmntv key

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    // 1. Upload Video File to Supabase Storage & Database
    async function uploadMovieToCloud(file, title, category, genre, description) {
      const fileExt = file.name.split('.').pop();
      const filePath = `${Date.now()}.${fileExt}`;

      // Upload file to the 'movies' bucket
      const { data: storageData, error: storageError } = await supabaseClient
        .storage
        .from('movies')
        .upload(filePath, file);

      if (storageError) {
        console.error('Storage Upload Error:', storageError);
        showToast('Storage upload failed.');
        return;
      }

      // Get the public URL for global streaming/downloading
      const { data: urlData } = supabaseClient
        .storage
        .from('movies')
        .getPublicUrl(filePath);

      const publicStreamUrl = urlData.publicUrl;

      // Save movie details to the Supabase Database table
      const { error: dbError } = await supabaseClient
        .from('movies')
        .insert([
          { title, category, genre, description, stream_url: publicStreamUrl }
        ]);

      if (!dbError) {
        showToast('Movie uploaded successfully! Everyone can now stream and download it.');
        fetchGlobalMovies();
      }
    }

    // 2. Fetch Movies from Supabase so ALL users see uploaded content
    async function fetchGlobalMovies() {
      const { data: movies, error } = await supabaseClient
        .from('movies')
        .select('*')
        .order('created_at', { ascending: false });

      if (!error && movies) {
        // Merge cloud movies into runtime catalogue view
        console.log('Fetched Global Movies:', movies);
      }
    }

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif']
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              accent: '#f43f5e'
            },
            dark: {
              900: '#0b0d14',
              800: '#121624',
              700: '#1a2035',
              600: '#262f4a'
            }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0b0d14;
    }
    ::-webkit-scrollbar-thumb {
      background: #262f4a;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #4f46e5;
    }
    .glass-nav {
      background: rgba(11, 13, 20, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .glass-card {
      background: rgba(26, 32, 53, 0.65);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card:hover {
      border-color: rgba(99, 102, 241, 0.4);
    }
    .text-gradient {
      background: linear-gradient(135deg, #a5b4fc 0%, #6366f1 50%, #f43f5e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="bg-dark-900 text-slate-100 font-sans min-h-screen flex flex-col selection:bg-brand-500 selection:text-white pb-12">

        <!-- Logo & Navigation Links -->
        <div class="flex items-center gap-8">
          <a href="#" onclick="switchCategory('All')" class="flex items-center gap-2.5 text-2xl font-display font-bold tracking-tight">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 to-brand-accent flex items-center justify-center shadow-lg shadow-brand-500/30">
              <i class="fa-solid font-bold fa-play text-white text-lg ml-0.5"></i>
            </div>
            <span>Cine<span class="text-gradient">Wave</span></span>
          </a>

          <!-- Navigation Links (Desktop) -->
          <nav class="hidden md:flex items-center gap-1 font-medium text-sm text-slate-300">

            <button onclick="switchCategory('Music')" id="nav-music" class="px-4 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition-all">Music</button>
            <button onclick="switchCategory('Watchlist')" id="nav-watchlist" class="px-4 py-2 rounded-lg hover:text-white hover:bg-slate-800/60 transition-all flex items-center gap-2">

        </div>

        <!-- Search & Community Actions -->

            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-sm"></i>
            <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Search titles, cast..." class="w-full bg-dark-800 border border-slate-700/80 rounded-full pl-10 pr-4 py-2 text-sm text-white placeholder-slate-400 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all" />
          </div>

          <button onclick="openUserUploadModal()" class="px-3.5 py-2 rounded-xl bg-gradient-to-r from-brand-600 to-brand-accent hover:opacity-90 text-white text-xs font-semibold flex items-center gap-2 shadow-lg shadow-brand-500/20 transition-all">
            <i class="fa-solid fa-plus"></i>
            <span class="hidden sm:inline">Upload Media</span>
          </button>

          <button onclick="openAdminPortalModal()" id="adminToggleBtn" class="px-3 py-2 rounded-xl bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-200 text-xs font-semibold flex items-center gap-2 transition-all">
            <i class="fa-solid fa-user-shield text-brand-400"></i>
            <span class="hidden md:inline" id="adminToggleText">Admin Portal</span>
          </button>

          <div id="user-nav-container"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- ================= USER / CATALOG VIEW ================= -->
  <main id="userView" class="pt-24 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 w-full flex-1">
    <div class="relative rounded-3xl overflow-hidden mb-10 border border-slate-800/80 shadow-2xl">
      <div id="heroBackground" class="absolute inset-0 bg-cover bg-center transition-all duration-700" style="background-image: url('https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?auto=format&fit=crop&w=1920&q=80');">
        <div class="absolute inset-0 bg-gradient-to-r from-dark-900 via-dark-900/80 to-transparent"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-dark-900 via-transparent to-transparent"></div>
      </div>

      <div class="relative z-10 p-8 sm:p-12 md:p-16 max-w-2xl">
        <span class="inline
