<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineWave - Stream & Share</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: sans-serif; }
    .glass { background: rgba(17, 24, 39, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #374151; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between custom-scrollbar">

  <!-- NAVIGATION BAR -->
  <nav class="sticky top-0 z-40 glass px-6 py-4 flex items-center justify-between shadow-xl">
    <div class="flex items-center space-x-3 cursor-pointer" onclick="switchCategory('All')">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 to-violet-500 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-500/30">
        <i class="fa-solid font-bold fa-play"></i>
      </div>
      <span class="text-2xl font-black tracking-wide text-transparent bg-clip-text bg-gradient-to-r from-white via-gray-200 to-indigo-400">CineWave</span>
    </div>

    <!-- SEARCH BAR -->
    <div class="hidden md:flex items-center bg-gray-900/80 border border-gray-700/60 rounded-full px-4 py-2 w-1/3 focus-within:border-indigo-500 transition">
      <i class="fa-solid fa-magnifying-glass text-gray-400 mr-2"></i>
      <input type="text" id="searchInput" placeholder="Search movies, series, music..." oninput="handleSearch()" class="bg-transparent border-none text-sm text-white focus:outline-none w-full" />
    </div>

    <!-- USER CONTROLS / AUTH -->
    <div class="flex items-center space-x-4" id="userNavArea">
      <!-- Dynamic User Navigation Rendered via JS -->
    </div>
  </nav>

  <!-- HERO SPOTLIGHT -->
  <header class="relative w-full h-[420px] md:h-[500px] flex items-end p-8 md:p-12 overflow-hidden" id="heroBanner">
    <div class="absolute inset-0 bg-cover bg-center transition-all duration-700 filter brightness-75 scale-105" id="heroBg"></div>
    <div class="absolute inset-0 bg-gradient-to-t from-[#0b0f19] via-[#0b0f19]/60 to-transparent"></div>
    <div class="relative z-10 max-w-2xl space-y-4">
      <span class="px-3 py-1 bg-indigo-600/80 backdrop-blur-md text-xs font-semibold uppercase tracking-wider rounded-md text-indigo-100" id="heroBadge">Featured</span>
      <h1 class="text-4xl md:text-6xl font-extrabold text-white tracking-tight leading-tight" id="heroTitle">Featured Title</h1>
      <p class="text-sm md:text-base text-gray-300 line-clamp-3" id="heroDescription">Loading spotlight content...</p>
      <div class="flex items-center space-x-4 pt-2">
        <button id="heroPlayBtn" onclick="" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl flex items-center space-x-2 transition shadow-lg shadow-indigo-600/40">
          <i class="fa-solid fa-play"></i> <span>Play Now</span>
        </button>
      </div>
    </div>
  </header>

  <!-- CATEGORY & GENRE FILTERS -->
  <main class="max-w-7xl mx-auto px-6 py-8 w-full flex-grow space-y-8">
    <div class="flex flex-wrap items-center justify-between gap-4 border-b border-gray-800 pb-4">
      <div class="flex space-x-2 overflow-x-auto pb-2 md:pb-0" id="categoryTabs">
        <button onclick="switchCategory('All')" class="cat-btn active-cat px-5 py-2 rounded-xl text-sm font-semibold transition bg-indigo-600 text-white">All Content</button>
        <button onclick="switchCategory('Movies')" class="cat-btn px-5 py-2 rounded-xl text-sm font-semibold transition bg-gray-800/80 text-gray-300 hover:bg-gray-700">Movies</button>
        <button onclick="switchCategory('Series')" class="cat-btn px-5 py-2 rounded-xl text-sm font-semibold transition bg-gray-800/80 text-gray-300 hover:bg-gray-700">TV Series</button>
        <button onclick="switchCategory('Music')" class="cat-btn px-5 py-2 rounded-xl text-sm font-semibold transition bg-gray-800/80 text-gray-300 hover:bg-gray-700">Music Tracks</button>
      </div>
    </div>

    <!-- CATALOG GRID -->
    <div id="mediaGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
      <!-- Media cards rendered via JS -->
    </div>
  </main>

  <!-- STREAMING PLAYER MODAL -->
  <div id="playerModal" class="fixed inset-0 z-50 hidden bg-black/90 backdrop-blur-md flex items-center justify-center p-4">
    <div class="glass w-full max-w-4xl rounded-2xl overflow-hidden shadow-2xl relative border border-gray-800 flex flex-col max-h-[90vh]">
      <div class="flex items-center justify-between px-6 py-4 border-b border-gray-800">
        <h3 class="text-lg font-bold text-white truncate" id="playerModalTitle">Now Playing</h3>
        <button onclick="closePlayerModal()" class="text-gray-400 hover:text-white text-xl">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <div class="bg-black flex-grow flex items-center justify-center min-h-[300px] relative" id="playerContainer">
        <!-- Dynamic Video or Audio Tag Rendered via JS -->
      </div>
      <div class="p-6 space-y-4 overflow-y-auto custom-scrollbar">
        <div class="flex items-center justify-between">
          <div>
            <span class="text-xs text-indigo-400 font-semibold uppercase tracking-wider" id="playerModalCategory">Category</span>
            <p class="text-sm text-gray-400" id="playerModalMeta">2026 • Sci-Fi</p>
          </div>
          <button id="downloadBtn" onclick="" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-medium rounded-xl flex items-center space-x-2 transition shadow-lg shadow-emerald-600/30">
            <i class="fa-solid fa-download"></i> <span>Download File</span>
          </button>
        </div>
        <p class="text-sm text-gray-300" id="playerModalDesc">Description text goes here.</p>
      </div>
    </div>
  </div>

  <!-- UPLOAD MEDIA MODAL -->
  <div id="uploadModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass w-full max-w-lg rounded-2xl p-6 shadow-2xl border border-gray-800 relative">
      <div class="flex items-center justify-between mb-6">
        <h3 class="text-xl font-bold text-white"><i class="fa-solid fa-cloud-arrow-up text-indigo-400 mr-2"></i> Upload Media</h3>
        <button onclick="closeUploadModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="handleMediaUpload(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Title *</label>
          <input type="text" id="uploadTitle" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="e.g. Inception" />
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Category</label>
            <select id="uploadCategory" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
              <option value="Movies">Movies</option>
              <option value="Series">TV Series</option>
              <option value="Music">Music</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Genre</label>
            <input type="text" id="uploadGenre" placeholder="Action, Sci-Fi..." class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" />
          </div>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Select Local File (Video / Audio) *</label>
          <input type="file" id="uploadFileInput" accept="video/*,audio/*" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-300 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Poster Image File (Optional)</label>
          <input type="file" id="uploadPosterInput" accept="image/*" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm text-gray-300 focus:outline-none" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Description</label>
          <textarea id="uploadDesc" rows="2" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" placeholder="Brief story or info..."></textarea>
        </div>
        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition">Publish Media</button>
      </form>
    </div>
  </div>

  <!-- AUTHENTICATION MODAL -->
  <div id="authModal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="glass w-full max-w-md rounded-2xl p-6 shadow-2xl border border-gray-800 relative">
      <div class="flex items-center justify-between mb-4">
        <h3 class="text-xl font-bold text-white" id="authModalTitle">Sign In</h3>
        <button onclick="closeAuthModal()" class="text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="handleAuthSubmit(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Username</label>
          <input type="text" id="authUsername" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-400 uppercase mb-1">Password</label>
          <input type="password" id="authPassword" required class="w-full bg-gray-900 border border-gray-700 rounded-xl px-4 py-2 text-sm text-white focus:outline-none focus:border-indigo-500" />
        </div>
        <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition">Continue</button>
      </form>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="glass mt-12 border-t border-gray-800 py-6 px-8 text-center text-xs text-gray-500">
    <p>&copy; 2026 CineWave Platform. All local media preserved via IndexedDB engine.</p>
  </footer>

  <script>
    // INDEXED DB REBUILD ENGINE
    const DB_NAME = 'CineWaveDB';
    const DB_VERSION = 1;
    let db = null;

    function initDB() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const dbRef = e.target.result;
          if (!dbRef.objectStoreNames.contains('mediaFiles')) {
            dbRef.createObjectStore('mediaFiles');
          }
        };
        request.onsuccess = (e) => {
          db = e.target.result;
          resolve(db);
        };
        request.onerror = (e) => reject(e.target.error);
      });
    }

    function storeBlob(key, blob) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('mediaFiles', 'readwrite');
        const store = tx.objectStore('mediaFiles');
        const req = store.put(blob, key);
        req.onsuccess = () => resolve();
        req.onerror = () => reject(req.error);
      });
    }

    function getBlob(key) {
      return new Promise((resolve, reject) => {
        const tx = db.transaction('mediaFiles', 'readonly');
        const store = tx.objectStore('mediaFiles');
        const req = store.get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    // STATE MANAGEMENT
    let currentUser = JSON.parse(localStorage.getItem('cinewave_user')) || null;
    let currentCategory = 'All';
    let mediaDatabase = JSON.parse(localStorage.getItem('cinewave_media')) || [
      {
        id: 'default-1',
        title: 'Sintel (Sample Video)',
        category: 'Movies',
        genre: 'Animation / Sci-Fi',
        desc: 'A open-source animation movie example streaming directly.',
        streamUrl: 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/Sintel.mp4',
        posterUrl: 'https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=800&q=80',
        views: 1420
      }
    ];

    window.onload = async () => {
      await initDB();
      renderUserNav();
      renderMediaCatalog();
      updateFeaturedSpotlight(mediaDatabase[0]);
    };

    // AUTH & LOGOUT HANDLERS
    function renderUserNav() {
      const area = document.getElementById('userNavArea');
      if (currentUser) {
        area.innerHTML = `
          <button onclick="openUploadModal()" class="px-4 py-2 bg-indigo-600/80 hover:bg-indigo-600 text-white text-xs font-semibold rounded-xl flex items-center space-x-2 transition">
            <i class="fa-solid fa-plus"></i> <span>Upload</span>
          </button>
          <span class="text-xs font-bold text-gray-300"><i class="fa-solid fa-user text-indigo-400 mr-1"></i> ${currentUser.username}</span>
          <button onclick="handleLogout()" class="px-3 py-1.5 bg-gray-800 hover:bg-red-600/80 text-gray-300 hover:text-white text-xs font-semibold rounded-xl transition">
            Log Out
          </button>
        `;
      } else {
        area.innerHTML = `
          <button onclick="openAuthModal()" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-xl shadow-md transition">
            Sign In
          </button>
        `;
      }
    }

    function handleLogout() {
      currentUser = null;
      localStorage.removeItem('cinewave_user');
      renderUserNav();
    }

    function openAuthModal() { document.getElementById('authModal').classList.remove('hidden'); }
    function closeAuthModal() { document.getElementById('authModal').classList.add('hidden'); }

    function handleAuthSubmit(e) {
      e.preventDefault();
      const username = document.getElementById('authUsername').value.trim();
      if (!username) return;
      currentUser = { username };
      localStorage.setItem('cinewave_user', JSON.stringify(currentUser));
      closeAuthModal();
      renderUserNav();
    }

    // MEDIA UPLOAD
    function openUploadModal() { document.getElementById('uploadModal').classList.remove('hidden'); }
    function closeUploadModal() { document.getElementById('uploadModal').classList.add('hidden'); }

    async function handleMediaUpload(e) {
      e.preventDefault();
      const title = document.getElementById('uploadTitle').value.trim();
      const category = document.getElementById('uploadCategory').value;
      const genre = document.getElementById('uploadGenre').value.trim() || 'General';
      const desc = document.getElementById('uploadDesc').value.trim() || 'No description provided.';
      
      const mediaFile = document.getElementById('uploadFileInput').files[0];
      const posterFile = document.getElementById('uploadPosterInput').files[0];

      if (!mediaFile) return;

      const mediaId = 'media-' + Date.now();
      await storeBlob(mediaId + '-file', mediaFile);

      let posterUrl = 'https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=800&q=80';
      if (posterFile) {
        await storeBlob(mediaId + '-poster', posterFile);
        posterUrl = mediaId + '-poster';
      }

      const newMedia = {
        id: mediaId,
        title,
        category,
        genre,
        desc,
        isLocal: true,
        fileKey: mediaId + '-file',
        fileType: mediaFile.type,
        fileName: mediaFile.name,
        posterUrl,
        views: 0
      };

      mediaDatabase.unshift(newMedia);
      localStorage.setItem('cinewave_media', JSON.stringify(mediaDatabase));
      
      closeUploadModal();
      renderMediaCatalog();
      updateFeaturedSpotlight(newMedia);
    }

    // DISPLAY & PLAYBACK
    function switchCategory(cat) {
      currentCategory = cat;
      renderMediaCatalog();
    }

    function renderMediaCatalog() {
      const grid = document.getElementById('mediaGrid');
      grid.innerHTML = '';
      const items = currentCategory === 'All' ? mediaDatabase : mediaDatabase.filter(m => m.category === currentCategory);

      items.forEach(async (item) => {
        let posterSrc = item.posterUrl;
        if (item.posterUrl && item.posterUrl.startsWith('media-')) {
          const blob = await getBlob(item.posterUrl);
          if (blob) posterSrc = URL.createObjectURL(blob);
        }

        const card = document.createElement('div');
        card.className = "glass rounded-2xl overflow-hidden shadow-lg hover:scale-105 transition duration-300 group cursor-pointer border border-gray-800 flex flex-col";
        card.onclick = () => openPlayerModal(item.id);
        card.innerHTML = `
          <div class="relative aspect-[2/3] w-full overflow-hidden bg-gray-900">
            <img src="${posterSrc}" alt="${item.title}" class="w-full h-full object-cover group-hover:scale-110 transition duration-500" />
            <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
              <div class="w-12 h-12 rounded-full bg-indigo-600 flex items-center justify-center text-white text-lg shadow-xl">
                <i class="fa-solid fa-play"></i>
              </div>
            </div>
          </div>
          <div class="p-4 flex flex-col justify-between flex-grow space-y-2">
            <div>
              <span class="text-[10px] font-bold text-indigo-400 uppercase tracking-wider">${item.category}</span>
              <h4 class="text-sm font-bold text-white truncate">${item.title}</h4>
            </div>
            <p class="text-xs text-gray-400">${item.genre}</p>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function updateFeaturedSpotlight(item) {
      if (!item) return;
      document.getElementById('heroTitle').innerText = item.title;
      document.getElementById('heroDescription').innerText = item.desc;
      document.getElementById('heroBadge').innerText = item.category;
      document.getElementById('heroPlayBtn').onclick = () => openPlayerModal(item.id);
    }

    async function openPlayerModal(id) {
      const item = mediaDatabase.find(m => m.id === id);
      if (!item) return;

      document.getElementById('playerModalTitle').innerText = item.title;
      document.getElementById('playerModalCategory').innerText = item.category;
      document.getElementById('playerModalMeta').innerText = item.genre;
      document.getElementById('playerModalDesc').innerText = item.desc;

      const container = document.getElementById('playerContainer');
      container.innerHTML = '';

      let srcUrl = item.streamUrl;
      if (item.isLocal) {
        const blob = await getBlob(item.fileKey);
        if (blob) {
          srcUrl = URL.createObjectURL(new Blob([blob], { type: item.fileType || 'video/mp4' }));
        }
      }

      if (item.category === 'Music') {
        container.innerHTML = `
          <div class="p-8 text-center flex flex-col items-center space-y-4 w-full">
            <i class="fa-solid fa-music text-6xl text-indigo-500 animate-pulse"></i>
            <audio controls autoplay class="w-full max-w-md">
              <source src="${srcUrl}" type="${item.fileType || 'audio/mpeg'}" />
            </audio>
          </div>
        `;
      } else {
        container.innerHTML = `
          <video controls autoplay class="w-full h-full max-h-[500px] object-contain">
            <source src="${srcUrl}" type="${item.fileType || 'video/mp4'}" />
          </video>
        `;
      }

      // Download Button Action
      document.getElementById('downloadBtn').onclick = () => {
        const a = document.createElement('a');
        a.href = srcUrl;
        a.download = item.fileName || `${item.title}.${item.category === 'Music' ? 'mp3' : 'mp4'}`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      };

      document.getElementById('playerModal').classList.remove('hidden');
    }

    function closePlayerModal() {
      const container = document.getElementById('playerContainer');
      container.innerHTML = '';
      document.getElementById('playerModal').classList.add('hidden');
    }
  </script>
</body>
</html>
