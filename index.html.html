<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify Web Player Clone</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .main-container {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* Sidebar Styling */
    .sidebar {
      width: 240px;
      background-color: #000;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #1db954;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-links, .library-links {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .nav-links a, .library-links a {
      color: #b3b3b3;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 16px;
      transition: color 0.2s ease;
    }

    .nav-links a:hover, .library-links a:hover, .nav-links a.active {
      color: #fff;
    }

    /* Main Content Area */
    .content {
      flex: 1;
      background: linear-gradient(to bottom, #1e1e1e, #121212);
      overflow-y: auto;
      padding: 24px 32px;
      border-radius: 8px;
      margin: 8px 8px 0 0;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .user-profile {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .section-title {
      font-size: 24px;
      margin-bottom: 16px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 24px;
    }

    .card {
      background-color: #181818;
      padding: 16px;
      border-radius: 8px;
      transition: background-color 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    .card:hover {
      background-color: #282828;
    }

    .card img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 4px;
      margin-bottom: 16px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-subtitle {
      font-size: 12px;
      color: #b3b3b3;
    }

    .play-btn-card {
      position: absolute;
      bottom: 80px;
      right: 24px;
      background-color: #1db954;
      border-radius: 50%;
      width: 48px;
      height: 48px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #000;
      font-size: 18px;
      opacity: 0;
      transform: translateY(8px);
      transition: all 0.3s ease;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3);
    }

    .card:hover .play-btn-card {
      opacity: 1;
      transform: translateY(0);
    }

    /* Player Footer Bar */
    .player-bar {
      height: 90px;
      background-color: #181818;
      border-top: 1px solid #282828;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 16px;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 14px;
      width: 30%;
    }

    .now-playing img {
      width: 56px;
      height: 56px;
      border-radius: 4px;
    }

    .track-info {
      display: flex;
      flex-direction: column;
    }

    .track-name {
      font-size: 14px;
      font-weight: 600;
    }

    .track-artist {
      font-size: 12px;
      color: #b3b3b3;
    }

    .player-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      width: 40%;
    }

    .control-buttons {
      display: flex;
      align-items: center;
      gap: 20px;
      color: #b3b3b3;
    }

    .control-buttons i {
      cursor: pointer;
      font-size: 16px;
      transition: color 0.2s;
    }

    .control-buttons i:hover {
      color: #fff;
    }

    .play-pause-btn {
      background-color: #fff;
      color: #000;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .play-pause-btn:hover {
      transform: scale(1.05);
    }

    .playback-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      max-width: 500px;
      font-size: 12px;
      color: #b3b3b3;
    }

    .progress-bar-container {
      flex: 1;
      height: 4px;
      background-color: #4d4d4d;
      border-radius: 2px;
      cursor: pointer;
      position: relative;
    }

    .progress-bar {
      height: 100%;
      background-color: #fff;
      border-radius: 2px;
      width: 0%;
    }

    .volume-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      width: 30%;
      justify-content: flex-end;
      color: #b3b3b3;
    }

    .volume-bar-container {
      width: 100px;
      height: 4px;
      background-color: #4d4d4d;
      border-radius: 2px;
      cursor: pointer;
    }

    .volume-bar {
      height: 100%;
      background-color: #fff;
      border-radius: 2px;
      width: 70%;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="logo">
        <i class="fa-brands fa-spotify"></i> Spotify
      </div>
      <ul class="nav-links">
        <li><a href="#" class="active"><i class="fa-solid fa-house"></i> Home</a></li>
        <li><a href="#"><i class="fa-solid fa-magnifying-glass"></i> Search</a></li>
      </ul>
      <ul class="library-links">
        <li><a href="#"><i class="fa-solid fa-book"></i> Your Library</a></li>
        <li><a href="#"><i class="fa-solid fa-square-plus"></i> Create Playlist</a></li>
        <li><a href="#"><i class="fa-solid fa-heart"></i> Liked Songs</a></li>
      </ul>
    </aside>

    <!-- Main Content Stream -->
    <main class="content">
      <header class="header">
        <div></div>
        <div class="user-profile">
          <i class="fa-regular fa-user"></i> Profile
        </div>
      </header>

      <h2 class="section-title">Popular Tracks</h2>
      
      <div class="card-grid" id="cardGrid">
        <!-- Rendered dynamically by JavaScript -->
      </div>
    </main>
  </div>

  <!-- Audio Player Bar -->
  <footer class="player-bar">
    <div class="now-playing">
      <img id="currentThumb" src="https://picsum.photos/id/10/200/200" alt="Cover">
      <div class="track-info">
        <span class="track-name" id="currentTitle">Select a Track</span>
        <span class="track-artist" id="currentArtist">Artist</span>
      </div>
    </div>

    <div class="player-controls">
      <div class="control-buttons">
        <i class="fa-solid fa-shuffle"></i>
        <i class="fa-solid fa-backward-step" id="prevBtn"></i>
        <div class="play-pause-btn" id="playBtn">
          <i class="fa-solid fa-play" id="playIcon"></i>
        </div>
        <i class="fa-solid fa-forward-step" id="nextBtn"></i>
        <i class="fa-solid fa-repeat"></i>
      </div>
      <div class="playback-bar">
        <span id="currentTime">0:00</span>
        <div class="progress-bar-container" id="progressContainer">
          <div class="progress-bar" id="progressBar"></div>
        </div>
        <span id="duration">0:00</span>
      </div>
    </div>

    <div class="volume-controls">
      <i class="fa-solid fa-volume-high"></i>
      <div class="volume-bar-container" id="volumeContainer">
        <div class="volume-bar" id="volumeBar"></div>
      </div>
    </div>
  </footer>

  <audio id="audioPlayer"></audio>

  <script>
    // Sample track catalog (using royalty-free audio files)
    const tracks = [
      {
        id: 0,
        title: "Synthwave Beats",
        artist: "Chill Producer",
        cover: "https://picsum.photos/id/146/200/200",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"
      },
      {
        id: 1,
        title: "Acoustic Journey",
        artist: "Guitar Hero",
        cover: "https://picsum.photos/id/225/200/200",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
      },
      {
        id: 2,
        title: "Midnight Drive",
        artist: "Neon Lights",
        cover: "https://picsum.photos/id/325/200/200",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"
      },
      {
        id: 3,
        title: "Electronic Sunset",
        artist: "Digital Wave",
        cover: "https://picsum.photos/id/445/200/200",
        src: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3"
      }
    ];

    let currentTrackIndex = 0;
    let isPlaying = false;

    // DOM Elements
    const audio = document.getElementById('audioPlayer');
    const playBtn = document.getElementById('playBtn');
    const playIcon = document.getElementById('playIcon');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    const currentThumb = document.getElementById('currentThumb');
    const currentTitle = document.getElementById('currentTitle');
    const currentArtist = document.getElementById('currentArtist');
    const progressBar = document.getElementById('progressBar');
    const progressContainer = document.getElementById('progressContainer');
    const currentTimeEl = document.getElementById('currentTime');
    const durationEl = document.getElementById('duration');
    const cardGrid = document.getElementById('cardGrid');
    const volumeContainer = document.getElementById('volumeContainer');
    const volumeBar = document.getElementById('volumeBar');

    // Render song cards dynamically
    function renderCards() {
      cardGrid.innerHTML = tracks.map((track, index) => `
        <div class="card" onclick="selectTrack(${index})">
          <img src="${track.cover}" alt="${track.title}">
          <div class="play-btn-card">
            <i class="fa-solid fa-play"></i>
          </div>
          <div class="card-title">${track.title}</div>
          <div class="card-subtitle">${track.artist}</div>
        </div>
      `).join('');
    }

    // Load track details
    function loadTrack(index) {
      currentTrackIndex = index;
      const track = tracks[currentTrackIndex];
      audio.src = track.src;
      currentThumb.src = track.cover;
      currentTitle.textContent = track.title;
      currentArtist.textContent = track.artist;
    }

    // Toggle Play/Pause state
    function togglePlay() {
      if (!audio.src) loadTrack(0);
      
      if (isPlaying) {
        audio.pause();
        playIcon.className = 'fa-solid fa-play';
      } else {
        audio.play();
        playIcon.className = 'fa-solid fa-pause';
      }
      isPlaying = !isPlaying;
    }

    // Select and start playing specific track
    function selectTrack(index) {
      loadTrack(index);
      isPlaying = false;
      togglePlay();
    }

    // Format time helpers (mm:ss)
    function formatTime(seconds) {
      if (isNaN(seconds)) return "0:00";
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // Update Progress Bar & Time text
    audio.addEventListener('timeupdate', () => {
      const progressPercent = (audio.currentTime / audio.duration) * 100;
      progressBar.style.width = `${progressPercent}%`;
      currentTimeEl.textContent = formatTime(audio.currentTime);
      durationEl.textContent = formatTime(audio.duration);
    });

    // Seek track timeline on click
    progressContainer.addEventListener('click', (e) => {
      const width = progressContainer.clientWidth;
      const clickX = e.offsetX;
      const duration = audio.duration;
      audio.currentTime = (clickX / width) * duration;
    });

    // Volume adjustment click
    volumeContainer.addEventListener('click', (e) => {
      const width = volumeContainer.clientWidth;
      const clickX = e.offsetX;
      const volume = clickX / width;
      audio.volume = volume;
      volumeBar.style.width = `${volume * 100}%`;
    });

    // Navigation Controls
    prevBtn.addEventListener('click', () => {
      currentTrackIndex = (currentTrackIndex - 1 + tracks.length) % tracks.length;
      selectTrack(currentTrackIndex);
    });

    nextBtn.addEventListener('click', () => {
      currentTrackIndex = (currentTrackIndex + 1) % tracks.length;
      selectTrack(currentTrackIndex);
    });

    playBtn.addEventListener('click', togglePlay);

    // Initial load
    renderCards();
    loadTrack(0);
  </script>
</body>
</html>
