<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CineWave - Stream Movies & Series</title>
  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            display: ['Outfit', 'sans-serif']
          },
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              accent: '#f43f5e'
            },
            dark: {
              900: '#000000',
              800: '#0a0a0a',
              700: '#121212',
              600: '#262626'
            }
          }
        }
      }
    }
  </script>
  <style>
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #000000; }
    ::-webkit-scrollbar-thumb { background: #262626; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #1d9bf0; }
    .glass-nav {
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .glass-card {
      background: #0a0a0a;
      border: 1px solid #262626;
    }
    .glass-card:hover { border-color: #3f3f46; }
    .text-gradient {
      background: linear-gradient(45deg, #f09433 0%, #dc2743 50%, #1d9bf0 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .ig-ring {
      background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
    }
    .ig-btn {
      background: linear-gradient(45deg, #f09433 0%, #dc2743 55%, #bc1888 100%);
    }
    .x-btn {
      background: #1d9bf0;
    }
    .x-btn:hover {
      background: #1a8cd8;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes heartPop {
      0% { transform: scale(0.35); opacity: 0; }
      50% { transform: scale(1.25); opacity: 1; }
      100% { transform: scale(1); opacity: 0; }
    }
    .heart-pop-anim { animation: heartPop 0.7s ease-out forwards; }
  </style>
</head>
<body class="bg-black text-zinc-100 font-sans min-h-screen flex flex-col selection:bg-sky-500 selection:text-white pb-16 md:pb-12">

  <!-- ================= TOP NAVIGATION BAR (INSTAGRAM + X HYBRID) ================= -->
  <header class="fixed top-0 left-0 right-0 z-40 glass-nav border-b border-zinc-800/90 transition-all duration-300">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
      <div class="flex items-center justify-between h-16 sm:h-20">
        
        <!-- Logo & Navigation Links -->
        <div class="flex items-center gap-6">
          <a href="#" onclick="switchPrimaryMode('feed'); switchCategory('All')" class="flex items-center gap-2.5 text-xl sm:text-2xl font-display font-extrabold tracking-tight">
            <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl ig-ring p-[2px] shadow-lg">
              <div class="w-full h-full rounded-[10px] bg-black flex items-center justify-center">
                <i class="fa-solid fa-play text-white text-sm sm:text-base ml-0.5"></i>
              </div>
            </div>
            <span id="siteLogoText">Cine<span class="text-gradient">Wave</span></span>
          </a>

          <!-- Navigation Links (Desktop: IG/X Feed + Original Catalog Tabs) -->
          <nav class="hidden lg:flex items-center gap-1 font-semibold text-xs text-zinc-300">
            <button onclick="switchPrimaryMode('feed')" id="mode-feed" class="px-3.5 py-2 rounded-full bg-zinc-900 text-white font-bold transition-all flex items-center gap-1.5">
              <i class="fa-solid fa-house text-sky-400"></i> Feed (IG/X)
            </button>
            <button onclick="switchPrimaryMode('reels')" id="mode-reels" class="px-3.5 py-2 rounded-full hover:text-white hover:bg-zinc-900 transition-all flex items-center gap-1.5">
              <i class="fa-solid fa-film text-rose-500"></i> Reels
            </button>
            <button onclick="switchPrimaryMode('catalog'); switchCategory('All')" id="nav-all" class="px-3.5 py-2 rounded-full hover:text-white hover:bg-zinc-900 transition-all">Browse All</button>
            <button onclick="switchPrimaryMode('catalog'); switchCategory('Movies')" id="nav-movies" class="px-3.5 py-2 rounded-full hover:text-white hover:bg-zinc-900 transition-all">Movies</button>
            <button onclick="switchPrimaryMode('catalog'); switchCategory('TV Shows')" id="nav-tv" class="px-3.5 py-2 rounded-full hover:text-white hover:bg-zinc-900 transition-all">TV Series</button>
            <button onclick="switchPrimaryMode('catalog'); switchCategory('Music')" id="nav-music" class="px-3.5 py-2 rounded-full hover:text-white hover:bg-zinc-900 transition-all">Music</button>
            <button onclick="switchPrimaryMode('catalog'); switchCategory('Watchlist')" id="nav-watchlist" class="px-3.5 py-2 rounded-full hover:text-white hover:bg-zinc-900 transition-all flex items-center gap-1.5">
              <span>Watchlist</span>
              <span id="watchlist-badge" class="bg-sky-500 text-white text-[10px] px-1.5 py-0.5 rounded-full font-bold">0</span>
            </button>
            <button onclick="openProfileView()" id="mode-profile" class="px-3.5 py-2 rounded-full hover:text-white hover:bg-zinc-900 transition-all flex items-center gap-1.5">
              <i class="fa-regular fa-user text-pink-400"></i> Profile
            </button>
          </nav>
        </div>

        <!-- Search & Actions (Preserving Original Upload, Admin/Owner Panel, and User Nav) -->
        <div class="flex items-center gap-2">
          <!-- Search Bar -->
          <div class="relative w-32 sm:w-52">
            <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-zinc-400 text-xs"></i>
            <input type="text" id="searchInput" onkeyup="handleSearch()" placeholder="Search posts & titles..." class="w-full bg-zinc-900 border border-zinc-800 rounded-full pl-9 pr-3.5 py-1.5 text-xs text-white placeholder-zinc-400 focus:outline-none focus:border-sky-500 transition-all" />
          </div>

          <!-- Upload Button (Respects Admin Settings - Original Intact) -->
          <button id="topUploadBtn" onclick="openUserUploadModal()" class="px-3.5 py-2 rounded-full ig-btn hover:opacity-90 text-white text-xs font-bold flex items-center gap-1.5 shadow-lg transition-all">
            <i class="fa-solid fa-cloud-arrow-up"></i>
            <span class="hidden sm:inline">Upload</span>
          </button>

          <!-- Owner Panel Button (Visible to all; strictly locked so only owner kims_19 can log in) -->
          <button onclick="openAdminPortalModal()" id="adminToggleBtn" class="px-3 py-2 rounded-full bg-amber-500/15 border border-amber-500/40 hover:bg-amber-500/25 text-amber-300 text-xs font-bold flex items-center gap-1.5 transition-all">
            <i class="fa-solid fa-crown text-amber-400"></i>
            <span class="hidden md:inline" id="adminToggleText">Owner Panel</span>
          </button>

          <!-- User State Button -->
          <div id="user-nav-container"></div>
        </div>
      </div>
    </div>
  </header>

  <!-- MOBILE BOTTOM BAR (INSTAGRAM / X STYLE) -->
  <nav class="lg:hidden fixed bottom-0 inset-x-0 z-40 bg-black/95 border-t border-zinc-800 h-14 flex items-center justify-around px-2">
    <button onclick="switchPrimaryMode('feed')" id="mob-feed" class="p-2 text-white text-lg" title="Feed"><i class="fa-solid fa-house"></i></button>
    <button onclick="switchPrimaryMode('reels')" id="mob-reels" class="p-2 text-zinc-400 text-lg" title="Reels"><i class="fa-solid fa-film"></i></button>
    <button onclick="focusSocialComposer()" class="p-2 text-sky-400 text-xl" title="New Post"><i class="fa-solid fa-circle-plus"></i></button>
    <button onclick="switchPrimaryMode('catalog'); switchCategory('All')" id="mob-catalog" class="p-2 text-zinc-400 text-lg" title="Movies & Music"><i class="fa-solid fa-clapperboard"></i></button>
    <button onclick="switchPrimaryMode('catalog'); switchCategory('Watchlist')" id="mob-watch" class="p-2 text-zinc-400 text-lg" title="Watchlist"><i class="fa-solid fa-bookmark"></i></button>
    <button onclick="openProfileView()" id="mob-profile" class="p-2 text-zinc-400 text-lg" title="IG Profile"><i class="fa-regular fa-circle-user"></i></button>
    <button onclick="handleLogout()" id="mob-logout" class="p-2 text-rose-400 hover:text-rose-300 text-lg" title="Log Out"><i class="fa-solid fa-right-from-bracket"></i></button>
  </nav>

  <!-- ================= MAIN CONTENT ================= -->
  <main id="userView" class="pt-20 sm:pt-24 max-w-7xl mx-auto px-3 sm:px-6 lg:px-8 w-full flex-1">
    <!-- Announcement Banner (Controlled by Admin Settings - Original Intact) -->
    <div id="siteBannerBox" class="hidden mb-5 bg-zinc-950 border border-sky-500/40 rounded-2xl px-5 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3 text-xs sm:text-sm text-zinc-200 font-medium">
        <i class="fa-solid fa-bullhorn text-sky-400"></i>
        <span id="siteBannerText">Welcome to CineWave!</span>
      </div>
    </div>

    <!-- ==================== SECTION A: INSTAGRAM + X SOCIAL FEED ==================== -->
    <section id="socialFeedView" class="grid grid-cols-1 lg:grid-cols-12 gap-6 mb-12">
      <!-- Left Rail (X / Instagram Quick Menu on Desktop) -->
      <aside class="hidden lg:block lg:col-span-3 space-y-3 sticky top-24 h-fit">
        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-3 space-y-1 text-xs font-bold">
          <button onclick="setSocialFeedTab('for-you')" id="leftTabForYou" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl bg-zinc-900 text-white">
            <i class="fa-solid fa-fire text-sky-400 w-4 text-center"></i> For You Timeline
          </button>
          <button onclick="setSocialFeedTab('following')" id="leftTabFollowing" class="w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-zinc-400 hover:bg-zinc-900 hover:text-white transition-all">
            <span class="flex items-center gap-3"><i class="fa-solid fa-user-check text-emerald-400 w-4 text-center"></i> Following</span>
            <span id="followingCountPill" class="px-2 py-0.5 rounded-full bg-sky-500/20 text-sky-300 text-[10px]">0</span>
          </button>
          <button onclick="switchPrimaryMode('reels')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-zinc-400 hover:bg-zinc-900 hover:text-white transition-all">
            <i class="fa-solid fa-film text-rose-500 w-4 text-center"></i> Watch IG Reels
          </button>
          <button onclick="switchPrimaryMode('catalog'); switchCategory('All')" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-zinc-400 hover:bg-zinc-900 hover:text-white transition-all">
            <i class="fa-solid fa-clapperboard text-amber-400 w-4 text-center"></i> Movies & Music Grid
          </button>
          <button onclick="openProfileView()" class="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-zinc-400 hover:bg-zinc-900 hover:text-white transition-all">
            <i class="fa-regular fa-id-badge text-pink-400 w-4 text-center"></i> My IG Profile & Videos
          </button>
          <button onclick="focusSocialComposer()" class="w-full mt-2 py-2.5 rounded-full x-btn text-white font-extrabold text-xs shadow">
            <i class="fa-solid fa-feather-pointed mr-1"></i> Post Update
          </button>
          <button onclick="handleLogout()" class="w-full mt-2 flex items-center gap-3 px-3.5 py-2.5 rounded-xl bg-rose-600/15 border border-rose-500/30 text-rose-400 hover:bg-rose-600 hover:text-white transition-all">
            <i class="fa-solid fa-right-from-bracket w-4 text-center"></i> Log Out
          </button>
        </div>

        <!-- Trending Tags -->
        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 space-y-2">
          <h4 class="font-display font-extrabold text-xs uppercase tracking-wider text-zinc-400">Trending on CineWave</h4>
          <div id="trendingTagsBox" class="space-y-1.5"></div>
        </div>
      </aside>

      <!-- Center Column: For You / Following Sticky Bar + IG Stories + Post Composer + Feed -->
      <div class="lg:col-span-6 max-w-[600px] w-full mx-auto space-y-4">
        <!-- X-Style Sticky Feed Switcher -->
        <div class="sticky top-16 sm:top-20 z-30 bg-black/90 backdrop-blur-md border border-zinc-800 rounded-2xl overflow-hidden grid grid-cols-2 text-center text-xs font-extrabold">
          <button onclick="setSocialFeedTab('for-you')" id="topTabForYou" class="py-3 relative text-white hover:bg-zinc-900/70 transition-colors">
            For You
            <span id="barForYou" class="absolute bottom-0 inset-x-10 h-1 rounded-full bg-sky-500"></span>
          </button>
          <button onclick="setSocialFeedTab('following')" id="topTabFollowing" class="py-3 relative text-zinc-400 hover:bg-zinc-900/70 hover:text-white transition-colors">
            Following (<span id="topFollowingCount">0</span>)
            <span id="barFollowing" class="hidden absolute bottom-0 inset-x-10 h-1 rounded-full bg-sky-500"></span>
          </button>
        </div>

        <!-- Instagram Stories Strip -->
        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-3">
          <div class="flex items-center justify-between mb-2 px-1">
            <span class="text-[11px] font-bold uppercase tracking-wider text-zinc-400">Stories & Creators</span>
            <button onclick="clearCreatorFilter()" id="clearCreatorFilterBtn" class="hidden text-[11px] font-bold text-sky-400 hover:underline">Show All</button>
          </div>
          <div id="igStoriesRow" class="flex items-center gap-3.5 overflow-x-auto no-scrollbar pb-1"></div>
        </div>

        <!-- X + Instagram Post Composer -->
        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4">
          <form onsubmit="handleSocialPostCreate(event)" class="flex gap-3">
            <div class="w-10 h-10 rounded-full ig-ring p-[2px] shrink-0 mt-0.5">
              <div id="socialComposerAvatar" class="w-full h-full rounded-full bg-black flex items-center justify-center text-xs font-extrabold text-white">CW</div>
            </div>
            <div class="flex-1 space-y-2.5">
              <div class="flex flex-wrap items-center gap-2">
                <input type="text" id="socialHandleInput" required placeholder="@yourhandle" class="bg-zinc-900 border border-zinc-800 focus:border-sky-500 rounded-xl px-3 py-1 text-xs text-white font-semibold w-36 focus:outline-none" />
                <select id="socialPostKind" class="bg-zinc-900 border border-zinc-800 focus:border-sky-500 rounded-xl px-2.5 py-1 text-xs text-zinc-300 focus:outline-none">
                  <option value="post">X Post / IG Photo</option>
                  <option value="reel">IG Reel / Clip</option>
                </select>
              </div>

              <textarea id="socialPostText" rows="2" required placeholder="What's happening? Post an update, review, photo, or video clip..." class="w-full bg-transparent text-sm text-white placeholder-zinc-500 focus:outline-none resize-none leading-relaxed"></textarea>

              <!-- Attach Photo / Video (File or URL) -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
                <label class="flex items-center gap-2 bg-zinc-900 hover:bg-zinc-800 border border-zinc-800 rounded-xl px-3 py-1.5 text-xs text-zinc-300 cursor-pointer truncate">
                  <i class="fa-regular fa-image text-sky-400"></i>
                  <span id="socialFileLabel" class="truncate">Attach Photo / Video</span>
                  <input type="file" id="socialFileInput" accept="image/*,video/*" onchange="handleSocialFileChange(this)" class="hidden" />
                </label>
                <input type="url" id="socialUrlInput" oninput="handleSocialUrlChange(this.value)" placeholder="Or paste image/video URL..." class="bg-zinc-900 border border-zinc-800 focus:border-sky-500 rounded-xl px-3 py-1.5 text-xs text-white placeholder-zinc-500 focus:outline-none" />
              </div>

              <!-- Preview -->
              <div id="socialPreviewBox" class="hidden relative rounded-xl overflow-hidden border border-zinc-800 bg-black max-h-52">
                <img id="socialPreviewImg" class="hidden w-full max-h-52 object-cover" />
                <video id="socialPreviewVid" controls muted class="hidden w-full max-h-52 object-cover"></video>
                <button type="button" onclick="clearSocialAttachment()" class="absolute top-2 right-2 w-7 h-7 rounded-full bg-black/80 text-white hover:bg-rose-600 text-xs flex items-center justify-center">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>

              <div class="flex items-center justify-between pt-2 border-t border-zinc-900">
                <div class="flex items-center gap-2 text-sky-400 text-xs">
                  <button type="button" onclick="document.getElementById('socialFileInput').click()" class="hover:bg-sky-500/10 px-2 py-1 rounded-lg"><i class="fa-regular fa-image mr-1"></i>Media</button>
                  <button type="button" onclick="appendToComposer(' #CineWave')" class="hover:bg-sky-500/10 px-2 py-1 rounded-lg"><i class="fa-solid fa-hashtag mr-1"></i>Tag</button>
                  <button type="button" onclick="appendToComposer(' 🔥')" class="hover:bg-sky-500/10 px-2 py-1 rounded-lg">🔥</button>
                </div>
                <button type="submit" id="socialPostSubmitBtn" class="px-5 py-1.5 rounded-full x-btn text-white font-extrabold text-xs shadow transition-all">
                  Post
                </button>
              </div>
            </div>
          </form>
        </div>

        <!-- Live Social Timeline -->
        <div id="socialFeedContainer" class="space-y-4"></div>
      </div>

      <!-- Right Sidebar: Who to Follow + Quick Movie Picks -->
      <aside class="hidden lg:block lg:col-span-3 space-y-4 sticky top-24 h-fit">
        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <h4 class="font-display font-extrabold text-xs uppercase tracking-wider text-zinc-300">Who to follow</h4>
            <button onclick="setSocialFeedTab('following')" class="text-[11px] font-bold text-sky-400 hover:underline">Following (<span id="sideFollowingCount">0</span>)</button>
          </div>
          <div id="whoToFollowContainer" class="space-y-3"></div>
        </div>

        <div class="bg-zinc-950 border border-zinc-800 rounded-2xl p-4 space-y-3">
          <div class="flex items-center justify-between">
            <h4 class="font-display font-extrabold text-xs uppercase tracking-wider text-zinc-300">Featured Movies & Music</h4>
            <button onclick="switchPrimaryMode('catalog'); switchCategory('All')" class="text-[11px] font-bold text-rose-400 hover:underline">See All</button>
          </div>
          <div id="sidebarMediaPreview" class="space-y-2.5"></div>
        </div>
      </aside>
    </section>

    <!-- ==================== SECTION B: INSTAGRAM REELS VIEW ==================== -->
    <section id="reelsView" class="hidden max-w-5xl mx-auto mb-12">
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
        <div class="lg:col-span-7 flex flex-col items-center">
          <div class="relative w-full max-w-[390px] aspect-[9/16] max-h-[75vh] rounded-3xl overflow-hidden bg-zinc-950 border border-zinc-800 shadow-2xl">
            <video id="reelPlayerVideo" playsinline loop onclick="toggleReelPlayPause()" class="w-full h-full object-cover cursor-pointer"></video>
            <img id="reelPlayerImage" class="hidden w-full h-full object-cover" />

            <div class="absolute top-0 inset-x-0 p-4 bg-gradient-to-b from-black/80 to-transparent flex items-center justify-between z-10">
              <span class="px-2.5 py-0.5 rounded-md ig-btn text-white text-[10px] font-extrabold uppercase">REELS</span>
              <span id="reelIndexLabel" class="text-xs font-bold text-white bg-black/50 px-2.5 py-0.5 rounded-full">1 / 1</span>
              <button onclick="toggleReelMuteState()" class="w-8 h-8 rounded-full bg-black/60 text-white flex items-center justify-center text-xs">
                <i id="reelMuteGlyph" class="fa-solid fa-volume-high"></i>
              </button>
            </div>

            <!-- Right Vertical Action Buttons -->
            <div class="absolute right-3 bottom-24 z-20 flex flex-col items-center gap-4">
              <button onclick="likeCurrentReel()" class="flex flex-col items-center gap-1">
                <div id="reelHeartCircle" class="w-11 h-11 rounded-full bg-black/60 border border-white/15 flex items-center justify-center text-white">
                  <i class="fa-solid fa-heart text-lg"></i>
                </div>
                <span id="reelLikeCount" class="text-[11px] font-bold text-white">0</span>
              </button>
              <button onclick="repostCurrentReel()" class="flex flex-col items-center gap-1">
                <div class="w-11 h-11 rounded-full bg-black/60 border border-white/15 flex items-center justify-center text-
